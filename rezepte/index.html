<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rezepte</title>
<meta name="description" content="Rezepte, Wochenplan und Einkaufsliste für die Familie – mit Bring-Anbindung.">
<meta name="theme-color" content="#c8553d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --bg: #faf6f0; --card: #ffffff; --ink: #2a2421; --muted: #7a6e66; --line: #ebe3d9;
  --accent: #c8553d; --accent-ink: #ffffff; --accent-soft: #f6e3dd; --green: #4f8a4b; --green-soft: #e3efe1;
  --danger: #b3261e; --shadow: 0 1px 2px rgba(60, 40, 30, .06), 0 6px 20px rgba(60, 40, 30, .08);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171412; --card: #221e1b; --ink: #f1ebe5; --muted: #a99d93; --line: #352f2a; --accent: #e07a62; --accent-ink: #1d0f0b;
    --accent-soft: #3b2620; --green: #8cc285; --green-soft: #22301f; --danger: #f2a39b; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.2; margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.btn { font: 600 .95rem var(--font); color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 16px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 6px 11px; font-size: .85rem; border-radius: 10px; }
.btn:disabled { opacity: .55; cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; }
textarea { resize: vertical; min-height: 90px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
label.field { display: grid; gap: 5px; font-size: .9rem; color: var(--muted); }
label.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
label.check input { width: auto; accent-color: var(--accent); }
.err { color: var(--danger); font-size: .9rem; min-height: 1.3em; }
.ok { color: var(--green); font-size: .9rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); font-size: .85rem; }
.chip.green { background: var(--green-soft); }
.chip button { border: 0; background: none; color: inherit; cursor: pointer; padding: 0; font-size: 1rem; line-height: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

/* Kopf und Leiste */
header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 10px; display: flex; align-items: center; gap: 10px; }
header.top h1 { font-size: 1.2rem; flex: 1; }
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs button { flex: 1; max-width: 190px; display: grid; justify-items: center; gap: 2px; padding: 9px 4px 10px; border: 0; background: none; color: var(--muted); font: 600 .74rem var(--font); cursor: pointer; }
nav.tabs svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

/* Rezepte */
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filters button { flex: none; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 13px; font: 600 .85rem var(--font); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rlist { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
.rcard { display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px; cursor: pointer; width: 100%; font: inherit; color: inherit; }
.thumb { width: 72px; height: 72px; flex: none; border-radius: 12px; background: var(--accent-soft) center / cover no-repeat; display: grid; place-items: center; font-size: 1.8rem; }
.rcard h3 { font-size: 1.02rem; }
.badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.fab { position: fixed; right: max(16px, calc(50vw - 364px)); bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 11; border-radius: 999px; padding: 14px 20px; box-shadow: var(--shadow); }
.empty { text-align: center; padding: 30px 10px; }

/* Rezept-Ansicht */
.hero { width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; background: var(--accent-soft) center / cover no-repeat; }
.ings { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ings li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.ings .q { min-width: 5.5em; font-weight: 600; text-align: right; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { border: 0; background: var(--card); color: var(--ink); width: 36px; height: 34px; font-size: 1.1rem; cursor: pointer; }
.stepper span { min-width: 2.6em; text-align: center; font-weight: 700; }

/* Editor */
/* Zutatenzeile: breit = Menge | Einheit | Zutat | ✕, darunter Kategorie; schmal = Zutat | ✕, darunter Menge | Einheit | Kategorie */
.irow { display: grid; grid-template-columns: 4.6em 6.4em minmax(0, 1fr) auto; grid-template-areas: "qty unit name rm" ". . cat ."; gap: 6px; align-items: center;
  padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.irow .qty { grid-area: qty; } .irow .unit { grid-area: unit; } .irow .name { grid-area: name; } .irow .rm { grid-area: rm; }
.irow .cat { grid-area: cat; font-size: .82rem; padding: 6px 8px; }
@media (max-width: 560px) {
  .irow { grid-template-columns: 4.4em 6.2em minmax(0, 1fr) auto; grid-template-areas: "name name name rm" "qty unit cat cat"; }
}
.imgbox { display: flex; gap: 12px; align-items: center; }
.imgbox .thumb { width: 96px; height: 96px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .9rem; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.center { min-height: 70vh; display: grid; place-items: center; }
.login { width: min(420px, 100%); display: grid; gap: 14px; }
.logo { font-size: 2.6rem; text-align: center; }
</style>
</head>
<body>
<header class="top" id="topbar" hidden>
  <div class="wrap">
    <button class="btn ghost small" id="backBtn" hidden aria-label="Zurück">←</button>
    <h1 id="viewTitle">Rezepte</h1>
    <span class="muted small" id="famName"></span>
  </div>
</header>

<main class="wrap" id="view"><div class="center"><p class="muted">Lädt …</p></div></main>

<button class="btn primary fab" id="fab" hidden>+ Rezept</button>

<nav class="tabs" id="tabs" hidden aria-label="Bereiche">
  <button data-tab="rezepte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-1.5zM8 7h6M8 11h6"/></svg>Rezepte</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Wochenplan</button>
  <button data-tab="einkauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Einkauf</button>
  <button data-tab="familie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.4 6-5.4s5.4 2 6 5.4"/><circle cx="17.5" cy="9" r="2.4"/><path d="M16 14.7c2.6.1 4.4 1.8 5 4.8"/></svg>Familie</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

// =====================================================================================
// Verbindung (Project URL und Publishable key sind für den Browser gedacht und dürfen öffentlich sein)
// =====================================================================================
const SUPABASE_URL = "https://lbncpooefucucqxvifib.supabase.co";
const SUPABASE_KEY = "sb_publishable_d2eEo3czxTozSiVCPOb90Q_nZRe4nN8";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const APP_URL = location.origin + location.pathname;

// =====================================================================================
// Grunddaten
// =====================================================================================
const CATS = ["Obst & Gemüse", "Fleisch & Fisch", "Milch & Eier", "Brot & Backwaren", "Nudeln, Reis & Getreide", "Konserven & Gläser", "Gewürze & Öle", "Tiefkühl", "Getränke", "Sonstiges"];
const UNITS = ["", "g", "kg", "ml", "l", "EL", "TL", "Prise", "Stück", "Bund", "Dose", "Becher", "Packung", "Zehe", "Scheibe", "Glas", "Tasse"];
const DEFAULT_SETTINGS = {
  persons: 4, vegetarians: 0,
  pantry: ["Salz", "Pfeffer", "Zucker", "Mehl", "Öl", "Olivenöl", "Essig", "Paprikapulver", "Oregano", "Gemüsebrühe", "Senf", "Ketchup", "Speisestärke", "Backpulver"],
  favorites: [], dislikes: [],
  substitutions: [
    { from: "Hackfleisch", to: "veganes Hack" }, { from: "Schnitzel", to: "Gemüseschnitzel" }, { from: "Speck", to: "Räuchertofu" },
    { from: "Hähnchen", to: "Tofu" }, { from: "Würstchen", to: "vegetarische Würstchen" }, { from: "Bratwurst", to: "vegetarische Bratwurst" },
    { from: "Schinken", to: "vegetarischer Aufschnitt" }, { from: "Gulasch", to: "Sojaschnetzel" },
  ],
};
// Kategorie aus dem Zutatennamen raten (nur Vorschlag, im Editor änderbar)
const CAT_HINTS = [
  // "gehackte Tomaten" ist kein Fleisch: "hack" nur am Wortanfang oder als Hackfleisch
  [/hackfleisch|\bhack\b|fleisch|schnitzel|hähnchen|huhn|pute|rinder|schwein|speck|schinken|wurst|lachs|fisch|thunfisch|garnele|gulasch/i, "Fleisch & Fisch"],
  [/milch|sahne|butter|käse|quark|joghurt|schmand|crème|creme|ei(er)?\b|mozzarella|parmesan|feta|frischkäse/i, "Milch & Eier"],
  [/brot|brötchen|toast|baguette|wrap|tortilla|blätterteig|pizzateig/i, "Brot & Backwaren"],
  [/nudel|spaghetti|pasta|reis|couscous|bulgur|quinoa|haferflocken|linsen|lasagne/i, "Nudeln, Reis & Getreide"],
  [/dose|passiert|tomatenmark|mais|kidney|kichererbsen|brühe|kokosmilch/i, "Konserven & Gläser"],
  [/salz|pfeffer|paprikapulver|curry|oregano|zimt|öl|essig|zucker|honig|senf|gewürz|chili|kreuzkümmel|muskat|thymian/i, "Gewürze & Öle"],
  [/tiefkühl|tk[- ]|erbsen tk|spinat tk/i, "Tiefkühl"],
  [/zwiebel|knoblauch|tomate|paprika|gurke|karotte|möhre|kartoffel|zucchini|aubergine|salat|spinat|brokkoli|blumenkohl|lauch|pilz|champignon|apfel|zitrone|banane|kräuter|basilikum|petersilie|ingwer|kürbis|avocado|frühlingszwiebel/i, "Obst & Gemüse"],
];
const guessCat = (name) => (CAT_HINTS.find(([re]) => re.test(name)) || [, "Sonstiges"])[1];

// =====================================================================================
// Helfer
// =====================================================================================
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtQty = (q) => q == null || q === "" ? "" : (Math.round(q * 100) / 100).toLocaleString("de-DE");
// Anzeige umgerechneter Mengen: Gewichte/Volumen als sinnvoll gerundete Zahl, sonst Brüche (¾ Bund, 1½ Dosen)
const FRACS = [[0, ""], [0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"], [1, ""]];
function niceQty(q, unit) {
  if (q == null) return "";
  if (["g", "ml"].includes(unit)) return (q >= 100 ? Math.round(q / 5) * 5 : Math.round(q)).toLocaleString("de-DE");
  if (["kg", "l"].includes(unit)) return (Math.round(q * 100) / 100).toLocaleString("de-DE");
  let whole = Math.floor(q), rest = q - whole;
  const [v, sym] = FRACS.reduce((best, f) => Math.abs(f[0] - rest) < Math.abs(best[0] - rest) ? f : best);
  if (v === 1) { whole++; return String(whole); }
  if (Math.abs(v - rest) > 0.05) return fmtQty(q);   // passt zu keinem Bruch → Dezimalzahl
  return (whole ? whole : "") + sym || "0";
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); }
const parseQty = (s) => {
  s = String(s || "").trim().replace(",", ".").replace("½", ".5").replace("¼", ".25").replace("¾", ".75");
  if (!s) return null;
  if (/^\d+\s*\/\s*\d+$/.test(s)) { const [a, b] = s.split("/").map(Number); return b ? a / b : null; }
  if (/^\d+\s+\d+\/\d+$/.test(s)) { const [w, f] = s.split(/\s+/); const [a, b] = f.split("/").map(Number); return +w + a / b; }
  const n = parseFloat(s); return Number.isFinite(n) ? n : null;
};
// "500 g Hackfleisch" → { qty: 500, unit: "g", name: "Hackfleisch" }
function parseIngredientLine(line) {
  const t = line.replace(/^[-•*\s]+/, "").trim();
  if (!t) return null;
  const m = t.match(/^((?:\d+[.,]?\d*|\d+\s*\/\s*\d+|\d+\s+\d+\/\d+|[½¼¾])\s*)?(g|kg|ml|l|el|tl|prise[n]?|stück|stk\.?|bund|dosen?|becher|packung(?:en)?|pck\.?|zehen?|scheiben?|gläser|glas|tassen?)?\.?\s+(.+)$/i);
  if (!m || (!m[1] && !m[2])) return { qty: null, unit: "", name: t, cat: guessCat(t) };
  const unitRaw = (m[2] || "").toLowerCase().replace(/\.$/, "");
  const unitMap = { el: "EL", tl: "TL", prise: "Prise", prisen: "Prise", stück: "Stück", stk: "Stück", bund: "Bund", dose: "Dose", dosen: "Dose", becher: "Becher", packung: "Packung", packungen: "Packung", pck: "Packung", zehe: "Zehe", zehen: "Zehe", scheibe: "Scheibe", scheiben: "Scheibe", glas: "Glas", gläser: "Glas", tasse: "Tasse", tassen: "Tasse" };
  const unit = unitMap[unitRaw] || (m[2] ? unitRaw : "");
  const name = m[3].trim();
  return { qty: parseQty(m[1]), unit, name, cat: unit === "Dose" || unit === "Glas" ? "Konserven & Gläser" : guessCat(name) };
}
async function resizeImage(file, max = 1600) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
}

// =====================================================================================
// Zustand
// =====================================================================================
let SESSION = null, FAMILY = null, MEMBERS = [], RECIPES = [], ME = null;
const imgCache = new Map();          // image_path -> signierte URL
async function imageUrl(path) {
  if (!path) return null;
  if (imgCache.has(path)) return imgCache.get(path);
  const { data } = await sb.storage.from("rezeptbilder").createSignedUrl(path, 3600);
  const url = data?.signedUrl || null; imgCache.set(path, url); return url;
}
const settings = () => ({ ...DEFAULT_SETTINGS, ...(FAMILY?.settings || {}) });

// =====================================================================================
// Start, Anmeldung, Familie
// =====================================================================================
// Supabase-Aufrufe nie direkt im Callback (kann hängen bleiben) → per setTimeout entkoppeln
sb.auth.onAuthStateChange((event, session) => {
  const changed = event === "INITIAL_SESSION" || (session?.user?.id || null) !== (SESSION?.user?.id || null);
  SESSION = session;
  if (event === "PASSWORD_RECOVERY") return setTimeout(renderNewPassword, 0);
  if (changed) setTimeout(boot, 0);
});

async function boot() {
  if (!SESSION) { FAMILY = null; return renderLogin(); }
  ME = SESSION.user;
  const { data: mem, error } = await sb.from("members").select("family_id, display_name, families(*)").eq("user_id", ME.id).limit(1);
  if (error) return renderFatal(error.message);
  if (!mem.length) { FAMILY = null; return renderOnboarding(); }
  FAMILY = mem[0].families;
  await Promise.all([loadMembers(), loadRecipes()]);
  $("#famName").textContent = FAMILY.name;
  if (!location.hash) location.hash = "#/rezepte"; else route();
}
async function loadMembers() { const { data } = await sb.from("members").select("user_id, display_name, joined_at").eq("family_id", FAMILY.id).order("joined_at"); MEMBERS = data || []; }
async function loadRecipes() {
  const { data, error } = await sb.from("recipes").select("*").eq("family_id", FAMILY.id).order("title");
  if (error) toast("Rezepte konnten nicht geladen werden: " + error.message);
  RECIPES = data || [];
}
function chrome(on) { $("#topbar").hidden = !on; $("#tabs").hidden = !on; if (!on) $("#fab").hidden = true; }
function renderFatal(msg) { chrome(false); $("#view").innerHTML = `<div class="center"><div class="card login"><h2>Da klemmt etwas</h2><p class="err">${esc(msg)}</p><p class="muted small">Ist die Datenbank schon eingerichtet (schema.sql)?</p><button class="btn" id="out">Abmelden</button></div></div>`; $("#out").onclick = () => sb.auth.signOut(); }

function renderLogin(msg = "") {
  chrome(false);
  $("#view").innerHTML = `<div class="center"><form class="card login" id="loginForm" autocomplete="on">
    <div class="logo">🍲</div>
    <h2 style="text-align:center">Unsere Rezepte</h2>
    <p class="muted small" style="text-align:center;margin:0">Rezepte, Wochenplan und Einkaufsliste für die ganze Familie.</p>
    <label class="field">E-Mail<input type="email" id="email" autocomplete="email" required></label>
    <label class="field">Passwort<input type="password" id="pw" autocomplete="current-password" minlength="8" required></label>
    <button class="btn primary" type="submit" id="signIn">Anmelden</button>
    <button class="btn" type="button" id="signUp">Neues Konto erstellen</button>
    <button class="btn ghost small" type="button" id="forgot">Passwort vergessen?</button>
    <div class="err" id="loginMsg" role="status">${esc(msg)}</div>
  </form></div>`;
  const out = (t, ok) => { const el = $("#loginMsg"); el.className = ok ? "ok" : "err"; el.textContent = t; };
  const creds = () => ({ email: $("#email").value.trim(), password: $("#pw").value });
  $("#loginForm").onsubmit = async (e) => {
    e.preventDefault(); $("#signIn").disabled = true; out("");
    const { error } = await sb.auth.signInWithPassword(creds());
    if (error) out(error.message === "Invalid login credentials" ? "E-Mail oder Passwort stimmt nicht." : error.message.includes("confirm") ? "Bitte bestätige zuerst deine E-Mail-Adresse (Link in der Mail)." : error.message);
    $("#signIn").disabled = false;
  };
  $("#signUp").onclick = async () => {
    const c = creds();
    if (!c.email || c.password.length < 8) return out("Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.");
    $("#signUp").disabled = true;
    const { data, error } = await sb.auth.signUp({ ...c, options: { emailRedirectTo: APP_URL } });
    if (error) out(error.message.includes("registered") ? "Für diese E-Mail gibt es schon ein Konto – bitte anmelden." : error.message);
    else if (!data.session) out("Fast geschafft: Wir haben dir eine E-Mail geschickt. Bitte bestätige den Link darin, dann kannst du dich anmelden.", true);
    $("#signUp").disabled = false;
  };
  $("#forgot").onclick = async () => {
    const email = $("#email").value.trim();
    if (!email) return out("Bitte zuerst deine E-Mail-Adresse eintragen.");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: APP_URL });
    out(error ? error.message : "Wir haben dir eine E-Mail zum Zurücksetzen geschickt.", !error);
  };

window.addEventListener("hashchange", () => { if (FAMILY) route(); });
document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { location.hash = "#/" + b.dataset.tab; }));
$("#backBtn").onclick = () => history.length > 1 ? history.back() : (location.hash = "#/rezepte");
$("#fab").onclick = () => { location.hash = "#/neu"; };
function setChrome(title, tab, { back = false, fab = false } = {}) {
  chrome(true);
  $("#viewTitle").textContent = title;
  $("#backBtn").hidden = !back;
  $("#fab").hidden = !fab;
  document.querySelectorAll("[data-tab]").forEach((b) => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  window.scrollTo({ top: 0 });
}
function route() {
  const [, view, id] = location.hash.split("/");
  if (view === "rezept" && id) return renderRecipe(id);
  if (view === "neu") return renderEditor(null);
  if (view === "bearbeiten" && id) return renderEditor(id);
  if (view === "plan") return renderSoon("Wochenplan", "plan", "Hier entsteht als Nächstes der Wochenplan: per Knopf aus euren markierten Rezepten zusammengestellt, ohne Wiederholungen, tageweise tauschbar.");
  if (view === "einkauf") return renderSoon("Einkauf", "einkauf", "Hier kommt die Einkaufsliste aus dem Wochenplan hin – umgerechnet auf eure Personenzahl, ohne euren Vorrat, mit vegetarischem Ersatz – und der Knopf, der alles in die Bring-App schickt.");
  if (view === "familie") return renderFamily();
  return renderList();
}
function renderSoon(title, tab, text) {
  setChrome(title, tab);
  $("#view").innerHTML = `<div class="card empty"><div class="logo">🚧</div><h2>Kommt im nächsten Schritt</h2><p class="muted">${esc(text)}</p></div>`;

let FILTER = "alle", QUERY = "";
function renderList() {
  setChrome("Rezepte", "rezepte", { fab: true });
  $("#view").innerHTML = `<div class="stack">
    <input type="search" id="q" placeholder="Rezept oder Zutat suchen …" value="${esc(QUERY)}" aria-label="Suchen">
    <div class="filters" role="group" aria-label="Filter">
      ${[["alle", "Alle"], ["plan", "Für Essensplan"], ["veg", "Vegetarisch"], ["schnell", "Schnell (≤ 30 min)"]].map(([k, t]) => `<button data-f="${k}" aria-pressed="${FILTER === k}">${t}</button>`).join("")}
    </div>
    <div class="rlist" id="rlist"></div>
  </div>`;
  $("#q").addEventListener("input", (e) => { QUERY = e.target.value; fillList(); });
  document.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { FILTER = b.dataset.f; document.querySelectorAll("[data-f]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); fillList(); });
  fillList();
}
function fillList() {
  const q = QUERY.trim().toLowerCase();
  const list = RECIPES.filter((r) => {
    if (FILTER === "plan" && !r.for_plan) return false;
    if (FILTER === "veg" && !r.vegetarian) return false;
    if (FILTER === "schnell" && !(r.prep_minutes && r.prep_minutes <= 30)) return false;
    if (!q) return true;
    return r.title.toLowerCase().includes(q) || (r.tags || []).some((t) => t.toLowerCase().includes(q)) || (r.ingredients || []).some((i) => (i.name || "").toLowerCase().includes(q));
  });
  const box = $("#rlist");
  if (!RECIPES.length) { box.innerHTML = `<div class="card empty"><div class="logo">📖</div><h2>Noch keine Rezepte</h2><p class="muted">Leg mit „+ Rezept“ euer erstes Rezept an. Bald geht das auch per Foto.</p></div>`; return; }
  if (!list.length) { box.innerHTML = `<p class="muted">Nichts gefunden.</p>`; return; }
  box.innerHTML = list.map((r) => `<button class="card rcard" data-id="${r.id}">
    <span class="thumb" data-img="${esc(r.image_path || "")}">${r.image_path ? "" : (r.vegetarian ? "🥗" : "🍽️")}</span>
    <span class="grow"><h3>${esc(r.title)}</h3>
      <span class="muted small">${r.servings} Portionen${r.prep_minutes ? " · " + r.prep_minutes + " min" : ""}</span>
      <span class="badges">${r.for_plan ? `<span class="chip">📅 Plan</span>` : ""}${r.vegetarian ? `<span class="chip green">vegetarisch</span>` : ""}</span>
    </span></button>`).join("");
  box.querySelectorAll("[data-id]").forEach((b) => b.onclick = () => { location.hash = "#/rezept/" + b.dataset.id; });
  box.querySelectorAll("[data-img]").forEach(async (el) => { const u = await imageUrl(el.dataset.img); if (u) el.style.backgroundImage = `url("${u}")`; });
}

async function renderRecipe(id) {
  const r = RECIPES.find((x) => x.id === id);
  if (!r) { location.hash = "#/rezepte"; return; }
  setChrome(r.title, "rezepte", { back: true });
  let portions = r.servings;
  const ingHtml = () => (r.ingredients || []).map((i) => {
    const q = i.qty != null ? i.qty * portions / r.servings : null;
    return `<li><span class="q">${esc([niceQty(q, i.unit), i.unit].filter(Boolean).join(" "))}</span><span>${esc(i.name)}</span></li>`;
  }).join("") || `<li class="muted">Keine Zutaten eingetragen.</li>`;
  $("#view").innerHTML = `<div class="stack">
    ${r.image_path ? `<div class="hero" id="hero"></div>` : ""}
    <div class="row">
      ${r.prep_minutes ? `<span class="chip">⏱ ${r.prep_minutes} min</span>` : ""}
      ${r.vegetarian ? `<span class="chip green">vegetarisch</span>` : ""}
      ${(r.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
    </div>
    <label class="check card" style="padding:12px 14px"><input type="checkbox" id="forPlan" ${r.for_plan ? "checked" : ""}> <span><strong>Für Essensplan-Vorschläge nutzen</strong><br><span class="muted small">Markierte Rezepte kommen in den Wochenplan.</span></span></label>
    <section class="card stack">
      <div class="row"><h2 class="grow">Zutaten</h2>
        <span class="stepper" aria-label="Portionen"><button type="button" id="pm" aria-label="Weniger">−</button><span id="pv">${portions}</span><button type="button" id="pp" aria-label="Mehr">+</button></span>
        <span class="muted small">Portionen</span></div>
      <ul class="ings" id="ings">${ingHtml()}</ul>
    </section>
    <section class="card stack"><h2>Zubereitung</h2>
      ${(r.steps || []).length ? `<ol class="steps">${r.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>` : `<p class="muted">Keine Schritte eingetragen.</p>`}
    </section>
    ${r.notes ? `<section class="card"><h2 style="margin-bottom:6px">Notizen</h2><p style="margin:0;white-space:pre-wrap">${esc(r.notes)}</p></section>` : ""}
    ${r.source ? `<p class="muted small">Quelle: ${esc(r.source)}</p>` : ""}
    <div class="row"><button class="btn primary" id="edit">Bearbeiten</button><span class="grow"></span><button class="btn danger" id="del">Löschen</button></div>
  </div>`;
  if (r.image_path) imageUrl(r.image_path).then((u) => { if (u && $("#hero")) $("#hero").style.backgroundImage = `url("${u}")`; });
  const upd = () => { $("#pv").textContent = portions; $("#ings").innerHTML = ingHtml(); };
  $("#pm").onclick = () => { if (portions > 1) { portions--; upd(); } };
  $("#pp").onclick = () => { if (portions < 50) { portions++; upd(); } };
  $("#forPlan").onchange = async (e) => {
    const { error } = await sb.from("recipes").update({ for_plan: e.target.checked }).eq("id", r.id);
    if (error) { toast(error.message); e.target.checked = !e.target.checked; } else { r.for_plan = e.target.checked; toast(r.for_plan ? "Kommt in die Essensplan-Vorschläge." : "Nicht mehr im Essensplan."); }
  };
  $("#edit").onclick = () => { location.hash = "#/bearbeiten/" + r.id; };
  let armed = false;
  $("#del").onclick = async () => {
    if (!armed) { armed = true; $("#del").textContent = "Wirklich löschen?"; setTimeout(() => { armed = false; if ($("#del")) $("#del").textContent = "Löschen"; }, 4000); return; }
    const { error } = await sb.from("recipes").delete().eq("id", r.id);
    if (error) return toast(error.message);
    if (r.image_path) await sb.storage.from("rezeptbilder").remove([r.image_path]);
    RECIPES = RECIPES.filter((x) => x.id !== r.id); toast("Rezept gelöscht."); location.hash = "#/rezepte";
  };
}

      <input class="name" placeholder="Zutat" value="${esc(i.name)}" aria-label="Zutat">

    const nameEl = d.querySelector(".name"), catEl = d.querySelector(".cat");

    ingBox.appendChild(d);
    return d;
  };
  (r.ingredients.length ? r.ingredients : [undefined, undefined, undefined]).forEach((i) => ingRow(i));
  $("#addIng").onclick = () => ingRow().querySelector(".name").focus();
  $("#ingParse").onclick = () => {
    const rows = $("#ingText").value.split("\n").map(parseIngredientLine).filter(Boolean);
    [...ingBox.children].forEach((d) => { if (!d.querySelector(".name").value.trim()) d.remove(); });

    $("#ingText").value = ""; toast(rows.length + " Zutaten übernommen.");

    };

      if (orig) { const { data, error } = await sb.from("recipes").update(row).eq("id", orig.id).select().single(); if (error) throw error; saved = data; }
      else { const { data, error } = await sb.from("recipes").insert(row).select().single(); if (error) throw error; saved = data; }
      // Foto erst nach dem Speichern hochladen (Pfad: Familie/Rezept-Zeit.jpg)
      if (newImage || removeImage) {
        const old = saved.image_path;
        let path = null;
        if (newImage) {
          path = `${FAMILY.id}/${saved.id}-${Date.now()}.jpg`;
          const { error } = await sb.storage.from("rezeptbilder").upload(path, newImage, { contentType: "image/jpeg" });
          if (error) throw error;
        }
        const { data, error } = await sb.from("recipes").update({ image_path: path }).eq("id", saved.id).select().single();
        if (error) throw error;
        saved = data;
        if (old) { await sb.storage.from("rezeptbilder").remove([old]); imgCache.delete(old); }
      }
      RECIPES = [...RECIPES.filter((x) => x.id !== saved.id), saved].sort((a, b) => a.title.localeCompare(b.title, "de"));
      toast("Gespeichert.");
      location.replace("#/rezept/" + saved.id);
    } catch (err) { $("#edMsg").textContent = err.message || String(err); $("#save").disabled = false; }
  };
}

      const vals = settings()[key] || [];
      list.innerHTML = vals.map((v, i) => `<span class="chip ${cls}">${esc(v)}<button type="button" data-rm="${i}" aria-label="${esc(v)} entfernen">×</button></span>`).join("") || `<span class="muted small">Noch nichts eingetragen.</span>`;
      list.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { const next = [...vals]; next.splice(+b.dataset.rm, 1); saveSettings({ [key]: next }); draw(); });
    };
    const add = () => {
      const v = input.value.split(",").map((x) => x.trim()).filter(Boolean); if (!v.length) return;
      saveSettings({ [key]: [...new Set([...(settings()[key] || []), ...v])] }); input.value = ""; draw();
    };
    box.querySelector("[data-add]").onclick = add;
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });
    draw();
  });
  // Personen
  const savePersons = () => {
    const persons = Math.max(1, Math.min(20, +$("#persons").value || 1)), vegs = Math.max(0, Math.min(persons, +$("#vegs").value || 0));
    $("#vegs").value = vegs; saveSettings({ persons, vegetarians: vegs });
  };
  $("#persons").addEventListener("change", savePersons); $("#vegs").addEventListener("change", savePersons);
  // Ersatzliste
  const saveSubs = () => saveSettings({ substitutions: [...document.querySelectorAll("#subs .sub")].map((d) => ({ from: d.querySelector(".from").value.trim(), to: d.querySelector(".to").value.trim() })).filter((x) => x.from && x.to) }, true);
  const subRow = (x = { from: "", to: "" }) => {
    const d = document.createElement("div"); d.className = "row sub";
    d.innerHTML = `<input class="grow from" value="${esc(x.from)}" aria-label="Fleischzutat" placeholder="Fleischzutat"><span>→</span><input class="grow to" value="${esc(x.to)}" aria-label="Ersatz" placeholder="Ersatz"><button type="button" class="btn ghost small" data-subrm aria-label="Entfernen">✕</button>`;
    d.querySelector("[data-subrm]").onclick = () => { d.remove(); saveSubs(); };
    d.querySelectorAll("input").forEach((i) => i.addEventListener("change", saveSubs));
    $("#subs").appendChild(d); return d;
  };
  (s.substitutions || []).forEach((x) => subRow(x));
  $("#subAdd").onclick = () => subRow().querySelector(".from").focus();
  // Einladungscode
  $("#copyCode").onclick = async () => { try { await navigator.clipboard.writeText(FAMILY.join_code); toast("Code kopiert."); } catch { toast("Bitte abschreiben: " + FAMILY.join_code); } };
  let armed = false;
  $("#newCode").onclick = async () => {
    if (!armed) { armed = true; $("#newCode").textContent = "Alten Code ungültig machen?"; setTimeout(() => { armed = false; if ($("#newCode")) $("#newCode").textContent = "Neuer Code"; }, 4000); return; }
    const { data, error } = await sb.rpc("new_join_code", { p_family: FAMILY.id });
    if (error) return toast(error.message);
    FAMILY.join_code = data; $("#jc").textContent = data; $("#newCode").textContent = "Neuer Code"; armed = false; toast("Neuer Einladungscode erstellt.");
  };
  $("#logout").onclick = () => sb.auth.signOut();
}

// Start: onAuthStateChange meldet beim Laden "INITIAL_SESSION" und ruft boot() auf.
</script>
</body>
